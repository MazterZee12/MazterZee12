<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -56 800 206" width="800" height="206" role="img" aria-label="A cool German Shepherd running and jumping over obstacles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="bodyClip">
      <path d="M22 80 Q20 62 44 60 Q76 54 104 58 Q116 62 114 78 Q112 94 92 93 L48 93 Q26 94 22 80 Z"/>
    </clipPath>
  </defs>

  <style>
    .runner { animation: run 6s linear infinite; }
    .jump { animation: jump 6s linear infinite; transform-origin: 80px 80px; }
    .shadow { animation: shadow 6s linear infinite; transform-box: fill-box; transform-origin: center; }
    .gate { animation: gate 6s linear infinite; }
    .bob { animation: bob 0.3s ease-in-out infinite alternate; }
    .leg { animation: swing 0.3s ease-in-out infinite alternate; }
    .leg.rev { animation-direction: alternate-reverse; }
    .tail { animation: wag 0.25s ease-in-out infinite alternate; }
    .tongue { animation: pant 0.3s ease-in-out infinite alternate; }

    .speed { animation: streak 0.5s ease-out infinite; opacity: 0; }
    .sp2 { animation-delay: 0.17s; }
    .sp3 { animation-delay: 0.34s; }

    .dust { animation: puff 0.6s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.4s; }

    .star { animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation-delay: 0.8s; }
    .s3 { animation-delay: 1.6s; }

    @keyframes run { from { transform: translateX(-190px); } to { transform: translateX(830px); } }
    @keyframes jump {
      0% { transform: translateY(0) rotate(0deg); }
      23.529% { transform: translateY(0) rotate(0deg); animation-timing-function: ease-out; }
      26.275% { transform: translateY(-38px) rotate(-12deg); animation-timing-function: ease-in-out; }
      33.431% { transform: translateY(-43px) rotate(0deg); animation-timing-function: ease-in-out; }
      40.588% { transform: translateY(-38px) rotate(6deg); animation-timing-function: ease-in; }
      43.333% { transform: translateY(0) rotate(0deg); }
      44.118% { transform: translateY(0) rotate(0deg); animation-timing-function: ease-out; }
      46.863% { transform: translateY(-44px) rotate(-12deg); animation-timing-function: ease-in-out; }
      55.098% { transform: translateY(-49px) rotate(0deg); animation-timing-function: ease-in-out; }
      63.333% { transform: translateY(-44px) rotate(6deg); animation-timing-function: ease-in; }
      66.078% { transform: translateY(0) rotate(0deg); }
      66.667% { transform: translateY(0) rotate(0deg); animation-timing-function: ease-out; }
      69.412% { transform: translateY(-40px) rotate(-12deg); animation-timing-function: ease-in-out; }
      77.059% { transform: translateY(-45px) rotate(0deg); animation-timing-function: ease-in-out; }
      84.706% { transform: translateY(-40px) rotate(6deg); animation-timing-function: ease-in; }
      87.451% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes shadow {
      0% { transform: scaleX(1); opacity: 0.35; }
      23.529% { transform: scaleX(1); opacity: 0.35; animation-timing-function: ease-out; }
      26.275% { transform: scaleX(0.65); opacity: 0.16; }
      40.588% { transform: scaleX(0.65); opacity: 0.16; animation-timing-function: ease-in; }
      43.333% { transform: scaleX(1); opacity: 0.35; }
      44.118% { transform: scaleX(1); opacity: 0.35; animation-timing-function: ease-out; }
      46.863% { transform: scaleX(0.65); opacity: 0.16; }
      63.333% { transform: scaleX(0.65); opacity: 0.16; animation-timing-function: ease-in; }
      66.078% { transform: scaleX(1); opacity: 0.35; }
      66.667% { transform: scaleX(1); opacity: 0.35; animation-timing-function: ease-out; }
      69.412% { transform: scaleX(0.65); opacity: 0.16; }
      84.706% { transform: scaleX(0.65); opacity: 0.16; animation-timing-function: ease-in; }
      87.451% { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(1); opacity: 0.35; }
    }
    @keyframes gate {
      0% { opacity: 1; }
      23.529% { opacity: 1; }
      24.029% { opacity: 0; }
      42.333% { opacity: 0; }
      43.333% { opacity: 1; }
      44.118% { opacity: 1; }
      44.618% { opacity: 0; }
      65.078% { opacity: 0; }
      66.078% { opacity: 1; }
      66.667% { opacity: 1; }
      67.167% { opacity: 0; }
      86.451% { opacity: 0; }
      87.451% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes swing { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(18deg); } }
    @keyframes pant { from { transform: scaleY(0.7); } to { transform: scaleY(1.15); } }
    @keyframes streak {
      0%   { transform: translateX(0); opacity: 0.55; }
      100% { transform: translateX(-28px); opacity: 0; }
    }
    @keyframes puff {
      0%   { transform: translate(0, 0) scaleX(0.6); opacity: 0.45; }
      100% { transform: translate(-48px, 0) scaleX(2.4); opacity: 0; }
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.8; } }
  </style>

  <!-- background stars -->
  <g fill="#58a6ff">
    <circle class="star" cx="90" cy="-20" r="1.6"/>
    <circle class="star s2" cx="190" cy="14" r="1.3"/>
    <circle class="star s3" cx="330" cy="-34" r="1.7"/>
    <circle class="star" cx="430" cy="6" r="1.5"/>
    <circle class="star s2" cx="590" cy="-12" r="1.4"/>
    <circle class="star s3" cx="690" cy="22" r="1.3"/>
    <circle class="star" cx="750" cy="-30" r="1.6"/>
  </g>

  <!-- ground -->
  <line x1="0" y1="116" x2="800" y2="116" stroke="#30363d" stroke-width="2"/>
  <line x1="0" y1="124" x2="800" y2="124" stroke="#21262d" stroke-width="2" stroke-dasharray="18 22"/>

  <!-- obstacle 1: traffic cone -->
  <g transform="translate(-100,0)">
    <polygon points="311,90 322,112 300,112" fill="#ff7b3a"/>
    <polygon points="307.5,100 314.5,100 316,105 306,105" fill="#f0f6fc"/>
    <rect x="298" y="112" width="26" height="4" rx="1.5" fill="#c2410c"/>
  </g>

  <!-- obstacle 2: hurdle -->
  <g transform="translate(-110,0)">
    <rect x="521" y="84" width="6" height="32" rx="2" fill="#8b949e"/>
    <rect x="557" y="84" width="6" height="32" rx="2" fill="#8b949e"/>
    <rect x="520" y="88" width="44" height="6" rx="2" fill="#f85149"/>
    <rect x="520" y="100" width="44" height="6" rx="2" fill="#f0f6fc"/>
    <rect x="526" y="88" width="6" height="6" fill="#f0f6fc"/>
    <rect x="538" y="88" width="6" height="6" fill="#f0f6fc"/>
    <rect x="550" y="88" width="6" height="6" fill="#f0f6fc"/>
    <rect x="532" y="100" width="6" height="6" fill="#f85149"/>
    <rect x="544" y="100" width="6" height="6" fill="#f85149"/>
  </g>

  <!-- obstacle 3: wooden crate -->
  <g transform="translate(-120,0)">
    <rect x="760" y="88" width="32" height="28" rx="3" fill="#b07a3a" stroke="#7d5321" stroke-width="2"/>
    <line x1="762" y1="90" x2="790" y2="114" stroke="#7d5321" stroke-width="2"/>
    <line x1="790" y1="90" x2="762" y2="114" stroke="#7d5321" stroke-width="2"/>
  </g>

  <g class="runner">
    <!-- shadow on the ground -->
    <ellipse class="shadow" cx="70" cy="117" rx="46" ry="4" fill="#000"/>

    <!-- dust, only while running on the ground -->
    <g class="gate">
      <g fill="#c9d1d9">
        <ellipse class="dust" cx="34" cy="113" rx="7" ry="2.2"/>
        <ellipse class="dust d2" cx="34" cy="113" rx="7" ry="2.2"/>
        <ellipse class="dust d3" cx="34" cy="113" rx="7" ry="2.2"/>
      </g>
    </g>

    <g class="jump">
      <!-- speed lines follow the dog -->
      <g stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round">
        <line class="speed" x1="-34" y1="60" x2="-8" y2="60"/>
        <line class="speed sp2" x1="-40" y1="76" x2="-10" y2="76"/>
        <line class="speed sp3" x1="-32" y1="92" x2="-6" y2="92"/>
      </g>

      <g class="bob">
        <!-- tail: bushy, black tip -->
        <g class="tail" style="transform-origin: 26px 72px;">
          <path d="M26 72 Q8 74 7 100" fill="none" stroke="#c58b3c" stroke-width="10" stroke-linecap="round"/>
          <path d="M7.3 93 L7 100" fill="none" stroke="#1b1b1b" stroke-width="10" stroke-linecap="round"/>
        </g>

        <!-- far legs (darker) -->
        <g class="leg rev" style="transform-origin: 44px 86px;">
          <rect x="39.5" y="84" width="9" height="30" rx="4.5" fill="#9b6a2a"/>
          <ellipse cx="45" cy="113" rx="7" ry="3.5" fill="#7d5321"/>
        </g>
        <g class="leg" style="transform-origin: 92px 86px;">
          <rect x="87.5" y="84" width="9" height="30" rx="4.5" fill="#9b6a2a"/>
          <ellipse cx="93" cy="113" rx="7" ry="3.5" fill="#7d5321"/>
        </g>

        <!-- body with black saddle -->
        <path d="M22 80 Q20 62 44 60 Q76 54 104 58 Q116 62 114 78 Q112 94 92 93 L48 93 Q26 94 22 80 Z" fill="#c58b3c"/>
        <g clip-path="url(#bodyClip)">
          <path d="M26 74 Q34 58 70 55 Q96 54 108 60 L106 68 Q80 64 50 70 Q36 74 30 88 Z" fill="#1b1b1b"/>
          <ellipse cx="70" cy="92" rx="30" ry="6" fill="#deb06a"/>
        </g>

        <!-- haunch -->
        <ellipse cx="38" cy="80" rx="15" ry="13" fill="#c58b3c"/>

        <!-- near legs -->
        <g class="leg" style="transform-origin: 38px 86px;">
          <rect x="33.5" y="84" width="9" height="30" rx="4.5" fill="#c58b3c"/>
          <ellipse cx="39" cy="113" rx="7" ry="3.5" fill="#a97430"/>
        </g>
        <g class="leg rev" style="transform-origin: 84px 86px;">
          <rect x="79.5" y="84" width="9" height="30" rx="4.5" fill="#c58b3c"/>
          <ellipse cx="85" cy="113" rx="7" ry="3.5" fill="#a97430"/>
        </g>

        <!-- chest and neck -->
        <ellipse cx="98" cy="74" rx="15" ry="16" fill="#c58b3c"/>
        <ellipse cx="102" cy="56" rx="15" ry="14" fill="#c58b3c"/>

        <!-- collar and tag -->
        <rect x="96" y="54" width="9" height="22" rx="4" fill="#1f6feb" transform="rotate(-18 100 65)"/>
        <circle cx="104" cy="78" r="4" fill="#f2cc60"/>

        <!-- far ear -->
        <polygon points="112,38 125,12 130,40" fill="#9b6a2a"/>

        <!-- head -->
        <circle cx="114" cy="50" r="15" fill="#c58b3c"/>

        <!-- black muzzle -->
        <path d="M122 44 L150 51 Q156 55 150 60 Q146 64 124 64 Z" fill="#1b1b1b"/>
        <ellipse cx="152" cy="54" rx="4" ry="3.4" fill="#0a0a0a"/>
        <circle cx="153" cy="52.8" r="1" fill="#555"/>
        <ellipse class="tongue" cx="138" cy="68" rx="4" ry="5" fill="#f78fb3" style="transform-origin: 138px 63px;"/>

        <!-- near ear: pointed and upright -->
        <polygon points="100,40 102,10 120,36" fill="#c58b3c"/>
        <polygon points="104,36 105,19 114,34" fill="#1b1b1b"/>

        <!-- sunglasses -->
        <rect x="116" y="38" width="26" height="9" rx="3" fill="#0d1117"/>
        <rect x="118" y="40" width="9" height="3" rx="1.5" fill="#58a6ff" opacity="0.7"/>
        <rect x="131" y="40" width="9" height="3" rx="1.5" fill="#58a6ff" opacity="0.7"/>
        <line x1="116" y1="42" x2="108" y2="40" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
